<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Eleven</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <main>
      <h1>Eleven</h1>
      <div class="orb" id="orb" data-state="off" aria-hidden="true">
        <span class="ring r1"></span>
        <span class="ring r2"></span>
        <span class="core"></span>
      </div>
      <p id="status" class="status" role="status" aria-live="polite">Desligada</p>
      <div id="progress" class="progress" hidden><div id="progress-bar"></div></div>
      <p id="caption" class="caption"></p>
      <button id="toggle" type="button">Ativar Eleven</button>
    </main>
    <aside id="panel" class="panel" hidden aria-label="Painel da Eleven">
      <header class="panel-head">
        <h2 id="panel-title"></h2>
        <a id="panel-open" class="panel-open" target="_blank" rel="noopener noreferrer" hidden>Abrir em nova aba</a>
        <button id="panel-close" class="icon" type="button" aria-label="Fechar painel">×</button>
      </header>
      <div id="panel-body" class="panel-body"></div>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
